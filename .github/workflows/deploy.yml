name: Deploy redirect to ethanpecora.com

# v1 sunset (2026-06): this site is retired. The personal site moved to the v2
# Astro project served at https://ethanpecora.com. The old Vite SPA build was
# replaced with a static redirect (redirect/index.html) so existing links and
# search results forward to the new domain instead of 404ing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only run one deploy at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage redirect as the published site
        run: |
          mkdir -p _site
          cp redirect/index.html _site/index.html
          cp redirect/index.html _site/404.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
